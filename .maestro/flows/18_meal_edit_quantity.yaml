appId: com.example.smart_food_life
---
# ============================================================
# MOD-04 | TC-MEAL-10: Điều chỉnh định lượng món
# ============================================================
- runFlow: 10_meal_add_dish_recipe.yaml
# Đang ở chi tiết bữa, đã có món Trứng

# Tap icon sửa định lượng (bút chì)
- tapOn:
    description: "Sửa định lượng"
    index: 0

# Dialog chỉnh sửa định lượng
- assertVisible: "Số khẩu phần"
- clearText
- inputText: "2"

# Lưu
- tapOn: "Lưu"

# Định lượng mới phải hiện
- assertVisible: "2"
