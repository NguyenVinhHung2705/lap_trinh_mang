- runFlow: 00_helpers.yaml

# Mở profile từ avatar góc phải trên header
- tapOn:
    description: "Tài khoản"
- assertVisible: "Tài khoản"

# Màn hình profile hiện thông tin user local
- assertVisible: "Đăng nhập bằng Firebase"
