appId: com.example.smart_food_life
---
# MOD-04 | TC-MEAL-01: Xem lịch & mở chi tiết bữa
- runFlow: 00_helpers.yaml
- tapOn: "Lên lịch"
- assertVisible: "Kế hoạch bữa ăn"
# Weekday labels thực tế: T2 T3 T4 T5 T6 T7 CN
- assertVisible: "T2"
- assertVisible: "CN"
# Slot labels: "Bữa Sáng" "Bữa Trưa" "Bữa Tối" "Bữa Phụ"
# (từ 'Bữa ${slot.labelVi}' trong code)
- tapOn: "Bữa Sáng"
- assertVisible: "Chi tiết bữa ăn"
- assertVisible: "Thêm món"
- tapOn:
    point: "5%,5%"
- assertVisible: "Kế hoạch bữa ăn"
